name: Nix Format
on:
  pull_request:
    branches:
      - main
      - develop
      - feature/*
    paths:
      - '**/*.nix'
      - '**/flake.lock'
      - '.github/workflows/nix-fmt.yml'
  push:
    branches:
      - main
      - develop
      - feature/*
    paths:
      - '**/*.nix'
      - '**/flake.lock'
      - '.github/workflows/nix-fmt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fmt:
    name: nix fmt (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            flake: .
          - name: main
            flake: package/main
          - name: i18n
            flake: package/umt_i18n
          - name: wasm
            flake: package/umt_wasm
    defaults:
      run:
        working-directory: ${{ matrix.flake }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check formatting
        run: nix fmt -- --fail-on-change flake.nix nix/treefmt.nix
