name: Auto Update Dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-dependencies:
    name: Update All Package Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@629b284231c2a82554b724e357e47fc6020833c8 # v3.21.2
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Python and uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Update Node.js packages
        run: |
          echo "Updating Node.js packages..."
          for dir in package/main package/umt_i18n package/umt_wasm; do
            if [ -f "$dir/package.json" ]; then
              echo "Updating $dir"
              cd "$dir"
              nix develop -c bun install
              nix develop -c bunx @biomejs/biome migrate --write
              cd - > /dev/null
            fi
          done
      - name: Update Rust packages
        run: |
          echo "Updating Rust packages..."
          for dir in package/umt_rust package/umt_wasm; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Updating $dir"
              cd "$dir"
              cargo update
              cd - > /dev/null
            fi
          done
      - name: Update Python packages
        run: |
          echo "Updating Python packages..."
          if [ -f "package/umt_python/pyproject.toml" ]; then
            echo "Updating package/umt_python"
            cd package/umt_python
            uv lock --upgrade
            cd - > /dev/null
          fi
      - name: Update Go packages
        run: |
          echo "Updating Go packages..."
          if [ -f "package/umt_go/go.mod" ]; then
            echo "Updating package/umt_go"
            cd package/umt_go
            go get -u ./...
            go mod tidy
            cd - > /dev/null
          fi
      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in lock files"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          fi
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="riya-amemiya/auto-update-dependencies-$(date +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"

          git add .

          git commit -m "$(cat <<'EOF'
          chore(deps): update dependencies across all packages

          Automated dependency updates for:
          - Node.js packages (main, umt_i18n, umt_wasm)
          - Rust packages (umt_rust, umt_wasm)
          - Python package (umt_python)
          - Go package (umt_go)
          EOF
          )"

          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore(deps): update dependencies across all packages" \
            --body "$(cat <<'EOF'
          ## Summary

          Automated dependency updates for all packages in the repository.

          ### Updated Packages

          - Node.js packages: main, umt_i18n, umt_wasm
          - Rust packages: umt_rust, umt_wasm
          - Python package: umt_python
          - Go package: umt_go

          ### Changes

          This PR includes updates to lock files across all package managers:
          - `bun.lockb` for Node.js packages
          - `Cargo.lock` for Rust packages
          - `uv.lock` for Python package
          - `go.sum` for Go package

          ## Test Plan

          - [ ] Verify all package lock files are updated
          - [ ] Run CI tests to ensure compatibility
          - [ ] Check for any breaking changes in updated dependencies
          EOF
          )" \
            --base main \
            --head "$BRANCH_NAME"
