name: Publish Wiki
on:
  push:
    branches:
      - main
    paths:
      - 'package/main/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    name: Publish TypeDoc to Wiki
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./package/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Restore Dependencies Cache
        id: cache-restore-dev-depends
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: dev-depends-ubuntu-latest-bun-${{ hashFiles('package/main/bun.lock') }}
      - name: Install Dependencies
        if: steps.cache-restore-dev-depends.outputs.cache-hit != 'true'
        run: bun i
      - name: Save Dependencies Cache
        if: steps.cache-restore-dev-depends.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: dev-depends-ubuntu-latest-bun-${{ hashFiles('package/main/bun.lock') }}
      - name: Generate TypeDoc
        run: bunx typedoc
      - name: Clone wiki repo
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki-remote
      - name: Sync content
        working-directory: ${{ github.workspace }}
        run: rsync -av --delete --exclude='.git' package/main/doc/ wiki-remote/
      - name: Commit and push
        working-directory: ${{ github.workspace }}/wiki-remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs(wiki): sync from ${GITHUB_SHA:0:7}"
          git push origin HEAD
