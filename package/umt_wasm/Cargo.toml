[package]
edition = "2024"
name = "umt-plugin-wasm"
version = "0.3.0"
[lib]
crate-type = ["cdylib", "rlib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
umt_rust = { path = "../umt_rust", version = "0.7.0" }
wasm-bindgen = "0.2.108"

# Disable wasm-opt so the build does not download a binaryen binary at build
# time; the bindings work without the post-optimization pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
